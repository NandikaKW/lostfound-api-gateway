spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:            # ← aluත් "server.webflux" level eka add karanna
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**,/auth/**
            - id: item-service
              uri: lb://ITEM-SERVICE
              predicates:
                - Path=/api/items/**
            - id: claim-service
              uri: lb://CLAIM-SERVICE
              predicates:
                - Path=/api/claims/**

server:
  port: 9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
#    ip-address: 34.47.225.165
    instance-id: ${spring.application.name}:${random.value}